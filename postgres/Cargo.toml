[package]
name = "xitca-postgres"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "an async postgres client"
repository = "https://github.com/HFQR/xitca-web"
keywords = ["xitca-web", "database", "postgres", "sql", "async"]
categories = ["database"]
authors = ["fakeshadow <everestshadow@gmail.com>"]
readme= "README.md"
rust-version.workspace = true

[lints]
workspace = true

[features]
# feature for connecting to tls enabled server.
tls = ["dep:xitca-tls", "xitca-tls/rustls-poll-ring-crypto", "dep:sha2", "dep:webpki-roots"]

# feature for using quic as client/server transport layer for better congetion handling on lossy connection.
# note: it does not work as stand alone and server side proxy for translating quic message to tcp is needed.
quic = ["dep:quinn", "dep:rustls-pemfile", "tls"]

# compatibility feature to enable implements with `futures` crate
compat = []

# io-uring driver optional
io-uring = ["xitca-io/runtime-uring", "dep:tokio-uring-xitca"]

# nightly compiler specific feature. can only be enabled with nightly Rust
nightly = []

[dependencies]
xitca-io = { workspace = true, features = ["runtime"] }
xitca-unsafe-collection = { workspace = true, features = ["bytes"] }

fallible-iterator = { workspace = true }
futures-core = { workspace = true }
lru = { workspace = true }
percent-encoding = { workspace = true }
postgres-protocol = { workspace = true }
postgres-types = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

# tls
sha2 = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
xitca-tls = { workspace = true, optional = true }

# quic
quinn = { workspace = true, default-features = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }

#io-uring
tokio-uring-xitca = { workspace = true, optional = true }

[dev-dependencies]
xitca-postgres-codegen = { workspace = true }
bb8 = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
futures = { workspace = true }
postgres-derive = { workspace = true }
postgres-types = { workspace = true, features = ["with-uuid-1"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }

[[bench]]
name = "fortune"
harness = false
