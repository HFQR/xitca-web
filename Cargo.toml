[workspace]
resolver = "2"
members = [
    "client",
    "codegen",
    "http",
    "io",
    "postgres",
    "postgres-codegen",
    "router",
    "server",
    "service",
    "test",
    "tls",
    "unsafe_collection",
    "web",
    "http-body",
    "http-encoding",
    "http-file",
    "http-multipart",
    "http-rate",
    "http-grpc",
    "http-ws",
    "tokio-uring"
]

[workspace.package]
rust-version = "1.98"

[patch.crates-io]
xitca-client = { path = "./client" }
xitca-codegen = { path = "./codegen" }
xitca-http = { path = "./http" }
xitca-io = { path = "./io" }
xitca-postgres = { path = "./postgres" }
xitca-postgres-codegen = { path = "./postgres-codegen" }
xitca-router = { path = "./router" }
xitca-server = { path = "./server" }
xitca-service = { path = "./service" }
xitca-tls = { path = "./tls" }
xitca-unsafe-collection = { path = "./unsafe_collection" }
xitca-web = { path = "./web" }
http-body-alt = { path = "./http-body" }
http-grpc-rs = { path = "./http-grpc" }
http-encoding = { path = "./http-encoding" }
http-file = { path = "http-file" }
http-multipart = { path = "./http-multipart" }
http-rate = { path = "./http-rate" }
http-ws = { path = "./http-ws" }

tokio-uring-xitca = { path = "./tokio-uring" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

# disable useless and/or broken lints
[workspace.lints.rust]
unreachable_patterns = "allow"

[workspace.lints.clippy]
await_holding_lock = "allow"
needless_return = "allow"
new_without_default = "allow"
len_without_is_empty = "allow"

[workspace.dependencies]
all_asserts = "2.2.0"
assert_matches = "1.5"
async-stream = "0.3"
base64 = { version = "0.22.0", default-features = false }
bb8 = "0.9.0"
brotli2 = "0.3.2"
bytes = "1.11.1"
compio = "0.17"
cookie = "0.18"
criterion = "0.8"
crossbeam = "0.8.0"
fallible-iterator = "0.2"
flate2 = "1.0.13"
fnv = "1.0.7"
futures = { version = "0.3", default-features = false }
futures-core = { version = "0.3.32", default-features = false }
futures-sink = { version = "0.3.17", default-features = false }
futures-util = { version = "0.3.25", default-features = false }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.4.0"
http-body = "1"
http-range-header = "0.4"
httparse = "1.10.1"
httpdate = "1.0.2"
iai = "0.1.1"
io-uring = "0.7.11"
libc = "0.2.178"
lru = { version = "0.16", default-features = false }
matchit = "0.9.1"
memchr = "2.5.0"
mime_guess = "2.0.4"
native_tls_crate = { package = "native-tls", version = "0.2.7", features = ["alpn"] }
nix = "0.31"
openssl = "0.10"
percent-encoding = "2.3.2"
pin-project-lite = "0.2.17"
postgres-derive = "0.4"
postgres-protocol = "0.6.5"
postgres-types = "0.2"
proc-macro2 = "1"
proptest = "1.11"
prost = { version = "0.14.3", default-features = false }
prost-build = "0.14"
quinn = { version = "0.11", default-features = false, features = ["ring"] }
quote = "1.0"
rand = "0.10.0"
rcgen = "0.14"
rustls_crate = { package = "rustls", version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", default-features = false }
serde_core = "1"
serde_json = "1"
serde_urlencoded = "0.7.1"
sha1 = "0.11.0"
sha2 = "0.10.8"
slab = "0.4.11"
socket2 = "0.6.3"
sqlparser = "0.60.0"
syn = { version = "2", features = ["full"] }
tempfile = "3.2.0"
tokio = "1.51.0"
tokio-test = "0.4.2"
tower-http = "0.6"
tower-layer = "0.3"
tower-service = "0.3"
tracing = { version = "0.1.40", default-features = false }
tracing-subscriber = "0.3"
uuid = "1"
webpki-roots = "1"
zstd = "0.13"

# workspace member crates. keep versions in sync with each crate's own version:
# a mismatched requirement silently disables [patch.crates-io] and pulls the
# published copy from crates.io instead of the local path.
http-body-alt = "0.1.0"
http-encoding = "0.3.0"
http-file = { version = "0.3.0", default-features = false }
http-grpc-rs = "0.1.0"
http-multipart = "0.1.2"
http-rate = "0.1.1"
http-ws = "0.4"
tokio-uring-xitca = "0.2.1"
xitca-client = "0.1"
xitca-codegen = "0.4.0"
xitca-http = { version = "0.10.0", default-features = false }
xitca-io = "0.6.0"
xitca-postgres = "0.5.0"
xitca-postgres-codegen = "0.1.0"
xitca-router = "0.4.3"
xitca-server = "0.7.0"
xitca-service = "0.3.0"
xitca-tls = "0.6.0"
xitca-unsafe-collection = "0.2.0"
xitca-web = "0.9.0"
